name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: Enable PostGIS on the test database
        run: |
          PGPASSWORD=darukaa psql -h localhost -U darukaa -d darukaa_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://darukaa:darukaa@localhost:5432/darukaa_test
          JWT_SECRET: test-secret
        run: pytest -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: |
          npx prettier --check "src/**/*.{js,jsx,css}"
          npm run lint

      - name: Production build
        working-directory: frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
